name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Icon Assets
        run: |
          npm ci || npm install
          node generate-assets.cjs

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean & Build APK (Debug & Release)
        run: ./gradlew clean assembleDebug assembleRelease --no-daemon

      - name: Build AAB (Release Bundle)
        run: ./gradlew bundleRelease

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: app/build/outputs/bundle/**/*.aab
